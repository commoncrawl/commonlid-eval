# Example config for `commonlid serve --config docs/eval_server.example.toml`.
# List every metric name you can expose with `commonlid list-server-metrics`.

# Total accepted submissions across all datasets (default 10; 0 = unlimited).
# Malformed and over-budget submissions are rejected and do not count.
max_submissions = 10

# Submission counter, shuffle seed and an archive of every submission
# (full summary.json + predictions.jsonl with gold labels). Keep it outside
# anything the agent can read. Relative paths resolve against this file.
state_dir = "./eval-server-state"

# Decimal places of returned scores. Coarser scores leak less per submission.
round_digits = 4

# Serve items in a seeded random order under opaque ids, so dataset order
# (often grouped by language) does not hint at labels. Leave shuffle_seed
# unset to generate one on first start and keep it in state_dir.
shuffle = true

host = "127.0.0.1"
port = 8000

# Require `Authorization: Bearer <token>` on every endpoint except /health.
# Prefer the COMMONLID_SERVER_TOKEN environment variable over a token here.
# api_token = "change-me"

# per_language.* metrics reveal which languages the gold set contains, so
# they are refused unless enabled here or with
# COMMONLID_SERVER_PER_LANGUAGE_METRICS=1.
per_language_metrics = false

# Evaluation dataset: texts only. Submissions use the global budget.
[[datasets]]
id = "commonlid_nano"
metrics = ["macro.f1_gold_only"]
max_submissions = 3          # optional cap for this dataset on top of the global one
# How predictions match gold labels: "exact" (default, as on the
# leaderboard), "macro" (an individual language also matches its
# macrolanguage, e.g. cmn/zho) or "sibling" (an upper bound).
macro_match = "exact"
description = "Texts sampled from real-world web data (Common Crawl)."  # shown to the agent

# Development dataset: items include their gold "label", so the agent can
# check its approach. Its submissions only count against its own cap, and
# per-language metrics are allowed. The server refuses to start if it shares
# texts with an evaluation dataset.
#
# This one is derived from the full CommonLID: without the texts of
# commonlid_nano (the evaluation set above) and texts under 20 characters,
# then a stratified sample as for the nano sets (5 texts per language plus
# 1000 spread in proportion). The seed makes the sample reproducible.
[[datasets]]
id = "commonlid_dev"
source = "commonlid"
exclude = ["commonlid_nano"]
min_chars = 20
sample = { max_size = 1000, min_per_language = 5, seed = 1 }
expose_labels = true
max_submissions = 20
metrics = ["macro.f1_gold_only", "micro.f1_gold_only", "per_language.f1"]

# More labelled data that shares no text with either set above: excluding a
# dataset of this config removes the texts it serves.
[[datasets]]
id = "commonlid_train"
source = "commonlid"
exclude = ["commonlid_nano", "commonlid_dev"]
min_chars = 20
sample = { max_size = 5000, seed = 2 }
expose_labels = true
max_submissions = 20
metrics = ["macro.f1_gold_only"]

# Any registered dataset works as a development dataset too.
[[datasets]]
id = "flores_dev"
expose_labels = true
limit = 2000                 # optional: serve and score only the first N samples
max_submissions = 20
metrics = ["macro.f1_gold_only", "micro.f1_gold_only", "per_language.f1"]
