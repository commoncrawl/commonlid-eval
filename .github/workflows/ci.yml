name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Lint + type-check once at the floor version (3.10). Both tools are
  # configured in pyproject.toml to target the lowest supported
  # interpreter; running them on every matrix entry is pure duplication.
  lint-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Sync dependencies
        run: make install PYTHON=3.10

      - name: Ruff lint
        run: make lint

      - name: Ruff format check
        run: make format-check

      - name: Mypy strict
        run: make typecheck

  # Run the test suite across every supported interpreter so that any
  # version-specific regression (stdlib deprecations, typing changes)
  # gets caught on every PR.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    name: pytest (py ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: make install PYTHON=${{ matrix.python-version }}

      - name: Pytest
        run: make test
